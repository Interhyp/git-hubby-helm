suite: labels
templates:
  - deployment.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should set helm.sh/chart label with name and version
    asserts:
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: "^git-hubby-[0-9]+\\.[0-9]+\\.[0-9]+"

  - it: should set app.kubernetes.io/name selector label
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "git-hubby"

  - it: should set app.kubernetes.io/instance selector label
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "test-release"

  - it: should set app.kubernetes.io/version label
    asserts:
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/version"]
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+"

  - it: should set app.kubernetes.io/managed-by label
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"


