suite: labels
templates:
  - deployment.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should set helm.sh/chart label with name and version
    asserts:
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: "^git-hubby-[0-9]+\\.[0-9]+\\.[0-9]+"

  - it: should set app.kubernetes.io/name selector label
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "git-hubby"

  - it: should set app.kubernetes.io/instance selector label
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "test-release"

  - it: should set app.kubernetes.io/version label
    chart:
      appVersion: "1.2.3"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "1.2.3"

  - it: should truncate long version labels without changing the image tag
    chart:
      appVersion: "snapshot-pr-123-0123456789abcdef0123456789abcdef01234567-12345678901-2"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "snapshot-pr-123-0123456789abcdef0123456789abcdef01234567-123456"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/interhyp/git-hubby:snapshot-pr-123-0123456789abcdef0123456789abcdef01234567-12345678901-2"

  - it: should make semantic version build metadata valid in labels
    chart:
      appVersion: "1.2.3+build.4"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "1.2.3_build.4"

  - it: should trim punctuation at the truncation boundary
    chart:
      appVersion: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-snapshot"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

  - it: should trim leading punctuation in image tags from version labels
    chart:
      appVersion: "_snapshot"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "snapshot"

  - it: should set app.kubernetes.io/managed-by label
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"


