suite: services
templates:
  - metrics-service.yaml
  - webhook-service.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should create metrics service
    template: metrics-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-release-git-hubby-controller-manager-metrics-service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8443
      - equal:
          path: spec.ports[0].targetPort
          value: 8443
      - equal:
          path: spec.selector.control-plane
          value: controller-manager

  - it: should create webhook service
    template: webhook-service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: test-release-git-hubby-webhook-service
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 443
      - equal:
          path: spec.ports[0].targetPort
          value: 9443
      - equal:
          path: spec.selector.control-plane
          value: controller-manager

