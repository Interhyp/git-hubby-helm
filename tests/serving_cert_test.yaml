suite: serving-cert
templates:
  - serving-cert.yaml
release:
  name: test-release
  namespace: test-ns
tests:
  - it: should render a Certificate resource
    asserts:
      - isKind:
          of: Certificate
      - equal:
          path: metadata.name
          value: test-release-git-hubby-serving-cert
      - equal:
          path: spec.secretName
          value: webhook-server-certificate

  - it: should set correct DNS names
    asserts:
      - contains:
          path: spec.dnsNames
          content: test-release-git-hubby-webhook-service.test-ns.svc
      - contains:
          path: spec.dnsNames
          content: test-release-git-hubby-webhook-service.test-ns.svc.cluster.local

  - it: should use issuerRef from values
    asserts:
      - equal:
          path: spec.issuerRef.kind
          value: Issuer
      - equal:
          path: spec.issuerRef.name
          value: selfsigned-issuer

  - it: should set optional duration
    set:
      servingCert.duration: "2160h0m0s"
    asserts:
      - equal:
          path: spec.duration
          value: "2160h0m0s"

  - it: should set optional renewBefore
    set:
      servingCert.renewBefore: "360h0m0s"
    asserts:
      - equal:
          path: spec.renewBefore
          value: "360h0m0s"

  - it: should not include optional fields when not set
    asserts:
      - notExists:
          path: spec.duration
      - notExists:
          path: spec.renewBefore
      - notExists:
          path: spec.privateKey
      - notExists:
          path: spec.subject
      - notExists:
          path: spec.usages

