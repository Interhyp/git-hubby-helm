apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "git-hubby.fullname" . }}-organization-viewer-role
  labels:
  {{- include "git-hubby.labels" . | nindent 4 }}
rules:
- apiGroups:
  - github.interhyp.de
  resources:
  - organizations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - github.interhyp.de
  resources:
  - organizations/status
  verbs:
  - get
