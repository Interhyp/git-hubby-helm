{{- if .Values.webhooks.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "git-hubby.fullname" . }}-serving-cert
  labels:
  {{- include "git-hubby.labels" . | nindent 4 }}
spec:
  dnsNames:
  - '{{ include "git-hubby.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc'
  - '{{ include "git-hubby.fullname" . }}-webhook-service.{{ .Release.Namespace }}.svc.{{
    .Values.kubernetesClusterDomain }}'
  secretName: webhook-server-certificate
  {{- with .Values.servingCert.duration }}
  duration: {{ . }}
  {{- end }}
  issuerRef:
    {{- if .Values.servingCert.issuerRef }}
    {{- toYaml .Values.servingCert.issuerRef | nindent 4 }}
    {{- else if .Values.selfSignedIssuer.enabled }}
    kind: Issuer
    name: {{ include "git-hubby.selfSignedIssuerName" . }}
    {{- else }}
    {{- fail "servingCert.issuerRef must be set when selfSignedIssuer.enabled is false" }}
    {{- end }}
  {{- with .Values.servingCert.privateKey }}
  privateKey:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.servingCert.renewBefore }}
  renewBefore: {{ . }}
  {{- end }}
  {{- with .Values.servingCert.subject }}
  subject:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.servingCert.usages }}
  usages:
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}

