apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" . }}-rulesetpreset-viewer-role
  labels:
  {{- include "chart.labels" . | nindent 4 }}
rules:
- apiGroups:
  - github.interhyp.de
  resources:
  - rulesetpresets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - github.interhyp.de
  resources:
  - rulesetpresets/status
  verbs:
  - get
