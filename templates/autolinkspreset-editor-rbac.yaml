apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "git-hubby.fullname" . }}-autolinkspreset-editor-role
  labels:
  {{- include "git-hubby.labels" . | nindent 4 }}
rules:
- apiGroups:
  - github.interhyp.de
  resources:
  - autolinkspresets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - github.interhyp.de
  resources:
  - autolinkspresets/status
  verbs:
  - get
