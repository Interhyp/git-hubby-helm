apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Values.controllerManager.appCredentialsSecretNamespace | default .Release.Namespace }}
  name: {{ include "git-hubby.fullname" . }}-app-credentials-role
  labels:
  {{- include "git-hubby.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: {{ .Values.controllerManager.appCredentialsSecretNamespace | default .Release.Namespace }}
  name: {{ include "git-hubby.fullname" . }}-app-credentials-rolebinding
  labels:
  {{- include "git-hubby.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: '{{ include "git-hubby.fullname" . }}-app-credentials-role'
subjects:
- kind: ServiceAccount
  name: '{{ include "git-hubby.serviceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
