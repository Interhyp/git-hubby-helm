apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "chart.fullname" . }}-validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "chart.fullname" . }}-serving-cert
  labels:
  {{- include "chart.labels" . | nindent 4 }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: '{{ include "chart.fullname" . }}-webhook-service'
      namespace: '{{ .Release.Namespace }}'
      path: /validate-github-interhyp-de-v1alpha1-organization
  failurePolicy: Fail
  name: vorganization-v1alpha1.kb.io
  {{- include "chart.webhookNamespaceSelector" . | nindent 2 }}
  rules:
  - apiGroups:
    - github.interhyp.de
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - organizations
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: '{{ include "chart.fullname" . }}-webhook-service'
      namespace: '{{ .Release.Namespace }}'
      path: /validate-github-interhyp-de-v1alpha1-repository
  failurePolicy: Fail
  name: vrepository-v1alpha1.kb.io
  {{- include "chart.webhookNamespaceSelector" . | nindent 2 }}
  rules:
  - apiGroups:
    - github.interhyp.de
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - repositories
  sideEffects: None
