apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" . }}-codesecurityconfiguration-admin-role
  labels:
  {{- include "chart.labels" . | nindent 4 }}
rules:
- apiGroups:
  - github.interhyp.de
  resources:
  - codesecurityconfigurations
  verbs:
  - '*'
- apiGroups:
  - github.interhyp.de
  resources:
  - codesecurityconfigurations/status
  verbs:
  - get
