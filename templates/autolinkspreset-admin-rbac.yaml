apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "git-hubby.fullname" . }}-autolinkspreset-admin-role
  labels:
  {{- include "git-hubby.labels" . | nindent 4 }}
rules:
- apiGroups:
  - github.interhyp.de
  resources:
  - autolinkspresets
  verbs:
  - '*'
- apiGroups:
  - github.interhyp.de
  resources:
  - autolinkspresets/status
  verbs:
  - get
