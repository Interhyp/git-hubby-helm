name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write

env:
  REGISTRY: ghcr.io
  CHART_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lowercase chart name
        run: echo "CHART_NAME=${CHART_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" --username "${{ github.actor }}" --password-stdin

      - name: Setup Node.js
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install semantic-release plugins
        if: github.ref == 'refs/heads/main'
        run: npm ci

      - name: Get latest tag before release
        id: before
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags
          echo "tag=$(git tag --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        id: semantic
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Detect new release
        id: release
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag --sort=-v:refname | head -1)
          if [[ "$LATEST_TAG" != "${{ steps.before.outputs.tag }}" ]]; then
            VERSION="${LATEST_TAG#v}"
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine chart version
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == "main" && "${{ steps.release.outputs.new_release_published }}" == "true" ]]; then
            echo "version=${{ steps.release.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            SHORT_SHA="$(git rev-parse --short HEAD)"
            echo "version=0.0.0-main.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            # Sanitize the branch name into a valid SemVer prerelease identifier:
            RAW_BRANCH="${{ github.ref_name }}"
            # 1) replace any char that is not alphanumeric, dot or hyphen with a hyphen (e.g. "/" -> "-")
            BRANCH="$(echo "$RAW_BRANCH" | sed 's|[^a-zA-Z0-9._-]|-|g')"
            # 2) collapse consecutive dots into a single dot to avoid empty SemVer identifiers (e.g. "a..b" -> "a.b")
            BRANCH="$(echo "$BRANCH" | sed -E 's/[.]+/./g')"
            # 3) strip leading/trailing dots or hyphens, which are invalid at the start/end of a SemVer identifier
            BRANCH="$(echo "$BRANCH" | sed -E 's/^[.-]+//; s/[.-]+$//')"
            # 4) truncate to 50 chars to keep the resulting version reasonably short
            BRANCH="$(echo "$BRANCH" | cut -c1-50)"
            # 5) strip trailing dots/hyphens again in case truncation cut right after a separator
            BRANCH="$(echo "$BRANCH" | sed -E 's/[.-]+$//')"
            SHORT_SHA="$(git rev-parse --short HEAD)"
            echo "version=0.0.0-snapshot.${BRANCH}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" Chart.yaml

      - name: Package Helm Chart
        run: helm package .

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR for Cosign
        # Cosign requires a docker login to GHCR for signing and verifying images
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        env:
          COSIGN_EXPERIMENTAL: "1"
        id: push
        run: |
          helm push *.tgz "oci://${{ env.REGISTRY }}/${{ env.CHART_NAME }}" | tee push.log
          DIGEST="$(grep -oE 'sha256:[a-f0-9]+' push.log | tail -1)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

          cosign sign --yes --oidc-provider github-actions \
            "ghcr.io/interhyp/git-hubby-helm/git-hubby@${DIGEST}"

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/Interhyp/git-hubby-helm/.+/.+$' \
            "ghcr.io/interhyp/git-hubby-helm/git-hubby@${{ steps.push.outputs.digest }}"

      - name: Write workflow summary
        run: |
          echo "## Helm Chart Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Chart** | \`${{ env.CHART_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Registry** | \`oci://${{ env.REGISTRY }}/${{ env.CHART_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Oras
        if: github.ref == 'refs/heads/main'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR with ORAS
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login "${{ env.REGISTRY }}" --username "${{ github.actor }}" --password-stdin

      - name: Publish Artifact Hub Metadata File
        if: github.ref == 'refs/heads/main'
        run: |
          oras push \
          ${{ env.REGISTRY }}/${{ env.CHART_NAME }}/git-hubby:artifacthub.io \
          --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
          artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
