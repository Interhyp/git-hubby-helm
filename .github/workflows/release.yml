name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  CHART_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lowercase chart name
        run: echo "CHART_NAME=${CHART_NAME,,}" >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" --username "${{ github.actor }}" --password-stdin

      - name: Setup Node.js
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install semantic-release plugins
        if: github.ref == 'refs/heads/main'
        run: npm ci

      - name: Get latest tag before release
        id: before
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags
          echo "tag=$(git tag --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Run semantic-release
        id: semantic
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Detect new release
        id: release
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags
          LATEST_TAG=$(git tag --sort=-v:refname | head -1)
          if [[ "$LATEST_TAG" != "${{ steps.before.outputs.tag }}" ]]; then
            VERSION="${LATEST_TAG#v}"
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "new_release_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine chart version
        id: version
        run: |
          if [[ "${{ github.ref_name }}" == "main" && "${{ steps.release.outputs.new_release_published }}" == "true" ]]; then
            echo "version=${{ steps.release.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            SHORT_SHA="$(git rev-parse --short HEAD)"
            echo "version=0.0.0-main.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          else
            BRANCH="$(echo '${{ github.ref_name }}' | sed 's|[^a-zA-Z0-9._-]|-|g' | cut -c1-50)"
            SHORT_SHA="$(git rev-parse --short HEAD)"
            echo "version=0.0.0-snapshot.${BRANCH}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Chart.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.version }}/" Chart.yaml

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --yes --import
          echo "${{ secrets.GPG_PASSPHRASE }}" > passphrase.txt
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --export-secret-keys --armor YOUR_KEY_ID > /tmp/secring.gpg

      - name: Extract key fingerprint
        id: gpg
        run: |
          FPR=$(gpg --list-secret-keys --with-colons --fingerprint | awk -F: '/^fpr:/ {print $10; exit}')
          KEYID=$(gpg --list-secret-keys --with-colons --keyid-format LONG | awk -F: '/^sec:/ {print $5; exit}')
          echo "fingerprint=$FPR" >> "$GITHUB_OUTPUT"
          echo "keyid=$KEYID" >> "$GITHUB_OUTPUT"
          echo "Using KEYID=$KEYID"
      - name: Configure GPG for batch operations
        run: |
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          gpg-agent --daemon --pinentry-program /usr/bin/pinentry-curses

      - name: Package Helm Chart
        run: gpg --export-secret-keys --armor ${{ steps.gpg.outputs.keyid }} > /tmp/secring.gpg && helm package . --sign --key "${{ steps.gpg.outputs.keyid }}" --keyring /tmp/secring.gpg --passphrase-file passphrase.txt

      - name: Push chart to GHCR
        id: push
        run: |
          helm push *.tgz "oci://${{ env.REGISTRY }}/${{ env.CHART_NAME }}" | tee push.log
          DIGEST="$(grep -oE 'sha256:[a-f0-9]+' push.log | tail -1)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Cleanup
        run: |
          rm -rf keyring.gpg passphrase.txt
