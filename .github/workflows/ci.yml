name: CI
on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &setup_helm
        name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Lint
        run: helm lint .

  unittest:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup_helm
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --verify=false
      - name: Test
        run: helm unittest .


  schema:
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *setup_helm
      - name: Install helm-values-schema-json plugin
        run: helm plugin install https://github.com/losisin/helm-values-schema-json.git --verify=false
      - name: Generate values schema json
        uses: losisin/helm-values-schema-json-action@3bbbe5960e765b4e45205e6b3af45daeaec7d7f5 # v3.2.1
        with:
          values: values.yaml
          output: values.schema.json
          fail-on-diff: true