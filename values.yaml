webhooks:
  enabled: true
controllerManager:
  podLabels: {}
  watchedNamespaces:
    - github-configuration
  manager:
    args:
    - --metrics-bind-address=:8443
    - --leader-elect
    - --health-probe-bind-address=:8081
    - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    image:
      repository: ghcr.io/interhyp/git-hubby
      # -- Overrides the image tag. Defaults to the chart's appVersion.
      tag: ""
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
  nodeSelector: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  replicas: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    # maxUnavailable: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  tolerations: []
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
kubernetesClusterDomain: cluster.local
metricsService:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  type: ClusterIP
serviceAccount:
  labels: {}
  secrets: []
  annotations: {}
  automount: true
  create: true
  name: ""
webhookService:
  type: ClusterIP
servingCert:
  # duration: 2160h0m0s
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
